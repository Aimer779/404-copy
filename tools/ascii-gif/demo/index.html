<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASCII GIF</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=21" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand-block">
          <svg class="brand-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <rect width="16" height="16" rx="3" fill="#0e0e12"/>
            <g shape-rendering="crispEdges">
              <rect x="3" y="3" width="2" height="1" fill="#f2f2f2"/>
              <rect x="6" y="3" width="1" height="1" fill="#f2f2f2"/>
              <rect x="3" y="5" width="3" height="1" fill="#f2f2f2"/>
              <rect x="7" y="5" width="1" height="1" fill="#f2f2f2"/>
              <rect x="9" y="5" width="1" height="1" fill="#f2f2f2"/>
              <rect x="3" y="7" width="2" height="1" fill="#f2f2f2"/>
              <rect x="6" y="7" width="4" height="1" fill="#f2f2f2"/>
              <rect x="11" y="7" width="2" height="1" fill="#f2f2f2"/>
              <rect x="3" y="9" width="4" height="1" fill="#f2f2f2"/>
              <rect x="8" y="9" width="2" height="1" fill="#f2f2f2"/>
              <rect x="11" y="9" width="2" height="1" fill="#f2f2f2"/>
              <rect x="3" y="11" width="1" height="1" fill="#f2f2f2"/>
              <rect x="5" y="11" width="3" height="1" fill="#f2f2f2"/>
              <rect x="9" y="11" width="1" height="1" fill="#f2f2f2"/>
              <rect x="3" y="13" width="1" height="1" fill="#f2f2f2"/>
              <rect x="5" y="13" width="2" height="1" fill="#f2f2f2"/>
            </g>
          </svg>
          <div class="brand">ASCII GIF</div>
          <p id="status" class="tagline" role="status">Turn a GIF into an ASCII animation.</p>
        </div>
      </header>
      <div class="workspace">
        <div class="stage-wrap">
          <div id="stage" class="stage relative clip">
            <canvas id="ascii" class="absolute inset no-pointer"></canvas>
          </div>
          <div class="transport">
            <button id="pause" class="icon-btn" type="button" aria-label="Pause" data-tooltip="Pause">
              <svg class="icon-pause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="14" y="4" width="4" height="16" rx="1" />
                <rect x="6" y="4" width="4" height="16" rx="1" />
              </svg>
              <svg class="icon-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 5v14l14-7Z" />
              </svg>
            </button>
            <input id="frame" type="range" min="0" max="0" value="0" aria-label="Frame" />
            <span id="frame-value">1/1</span>
            <span class="transport-split" aria-hidden="true"></span>
            <button id="choose-gif" class="icon-btn" type="button" aria-label="Import GIF" data-tooltip="Import GIF">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="17 8 12 3 7 8" />
                <line x1="12" x2="12" y1="3" y2="15" />
              </svg>
            </button>
            <input id="gif-file" type="file" accept=".gif,image/gif" hidden />
            <button id="choose-recipe" class="icon-btn" type="button" aria-label="Import recipe" data-tooltip="Import recipe">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
                <path d="M14 2v4a2 2 0 0 0 2 2h4" />
                <path d="m10 13-2 2 2 2" />
                <path d="m14 17 2-2-2-2" />
              </svg>
            </button>
            <input id="recipe-file" type="file" accept=".json,application/json" hidden />
            <button id="copy-agent" class="icon-btn" type="button" aria-label="Copy for Agent" data-tooltip="Copy for Agent">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect width="8" height="4" x="8" y="2" rx="1" ry="1" />
                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
                <path d="M9 12h6" />
                <path d="M9 16h6" />
              </svg>
            </button>
            <button id="export-png" class="icon-btn" type="button" aria-label="Export PNG" data-tooltip="Export PNG">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
                <circle cx="9" cy="9" r="2" />
                <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
              </svg>
            </button>
            <button id="export-recipe" class="icon-btn primary" type="button" aria-label="Export recipe" data-tooltip="Export recipe">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
                <path d="M14 2v4a2 2 0 0 0 2 2h4" />
                <path d="M12 12v6" />
                <path d="m9 15 3 3 3-3" />
              </svg>
            </button>
          </div>
        </div>
        <aside class="inspector">
          <section class="group">
            <h2>/ CHARACTERS</h2>
            <div class="field">
              <div class="field-label"><span>Columns</span><span id="columns-value">110</span></div>
              <input id="columns" type="range" min="40" max="160" value="110" />
            </div>
            <label class="field">
              <span class="field-label">Font</span>
              <select id="font">
                <option value="consolas" selected>Consolas</option>
                <option value="cascadia">Cascadia Mono</option>
                <option value="courier">Courier New</option>
                <option value="lucida">Lucida Console</option>
                <option value="vt323">VT323</option>
              </select>
            </label>
            <label class="field">
              <span class="field-label">Glyphs</span>
              <select id="glyphs">
                <option value="binary" selected>01</option>
                <option value="ascii">@%#* glyphs</option>
                <option value="block">█▓▒░ blocks</option>
                <option value="mixed">@▓#* mixed</option>
                <option value="braille">⣿ braille</option>
                <option value="ox">OX</option>
              </select>
            </label>
            <div class="field">
              <span class="field-label">Color</span>
              <label class="color-row">
                <input id="color" type="color" value="#f3f3f3" />
                <span id="color-hex">#F3F3F3</span>
              </label>
            </div>
          </section>
          <section class="group">
            <h2>/ BACKDROP</h2>
            <div class="mass-toggle">
              <button id="light-mass" type="button">Light</button>
              <button id="dark-mass" class="is-on" type="button">Dark</button>
            </div>
          </section>
          <section class="group">
            <h2>/ SOURCE</h2>
            <div class="preview relative clip">
              <canvas id="gray" class="absolute inset no-pointer"></canvas>
            </div>
            <p class="source-meta" id="source-meta">
              <span id="source-file"></span>
              · <b id="source-frames">0</b> frames
              · <b id="source-grid">0×0</b>
            </p>
            <p class="sources"><a href="./">Squidward</a> · <a href="?gif=../fixtures/bust.gif">Bust</a> · <a href="?gif=../fixtures/disposal.gif">Disposal</a></p>
          </section>
        </aside>
      </div>
    </div>
    <dialog id="recipe-panel" class="recipe-panel" aria-labelledby="recipe-panel-title">
      <div class="recipe-head">
        <div>
          <h2 id="recipe-panel-title">Recipe</h2>
          <p id="recipe-file-label"></p>
        </div>
        <button id="recipe-close" class="ghost" type="button">Close</button>
      </div>
      <textarea id="recipe-json" spellcheck="false"></textarea>
      <div class="recipe-foot">
        <p id="recipe-note" role="status"></p>
        <button id="recipe-download" class="ghost" type="button">Download</button>
        <button id="recipe-copy" class="primary" type="button">Copy</button>
      </div>
    </dialog>
    <script type="module" src="./main.mjs?v=19"></script>
  </body>
</html>
