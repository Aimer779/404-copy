<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASCII GIF</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css?v=12" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">ASCII GIF</div>
        <p id="status" role="status"></p>
        <div class="top-actions">
          <button id="choose-gif" type="button">导入 GIF</button>
          <input id="gif-file" type="file" accept=".gif,image/gif" hidden />
          <button id="choose-recipe" type="button">导入配方</button>
          <input id="recipe-file" type="file" accept=".json,application/json" hidden />
          <button id="export-recipe" type="button">导出配方</button>
          <button id="copy-agent" type="button">复制给 Agent</button>
          <button id="export-png" type="button">导出 PNG</button>
        </div>
      </header>
      <div class="workspace">
        <div class="stage-wrap">
          <div id="stage" class="stage relative clip">
            <canvas id="ascii" class="absolute inset no-pointer"></canvas>
          </div>
        </div>
        <aside class="inspector">
          <section class="group">
            <h2>/ SOURCE</h2>
            <div class="field">
              <div class="field-label"><span>帧</span><span id="frame-value">1</span></div>
              <input id="frame" type="range" min="0" max="0" value="0" />
            </div>
            <button id="pause" type="button">暂停</button>
            <p class="sources"><a href="./">人物夹具</a> · <a href="?gif=../fixtures/disposal.gif">处置测试</a></p>
          </section>
          <section class="group">
            <h2>/ CHARACTERS</h2>
            <div class="field">
              <div class="field-label"><span>列数</span><span id="columns-value">110</span></div>
              <input id="columns" type="range" min="40" max="160" value="110" />
            </div>
            <label class="field">
              <span class="field-label">字体</span>
              <select id="font">
                <option value="consolas" selected>Consolas</option>
                <option value="cascadia">Cascadia Mono</option>
                <option value="courier">Courier New</option>
                <option value="lucida">Lucida Console</option>
                <option value="vt323">VT323</option>
              </select>
            </label>
            <label class="field">
              <span class="field-label">颜色</span>
              <input id="color" type="color" value="#000013" />
            </label>
          </section>
          <section class="group">
            <h2>/ BACKDROP</h2>
            <div class="mass-toggle">
              <button id="light-mass" class="is-on" type="button">白块</button>
              <button id="dark-mass" type="button">黑块</button>
            </div>
          </section>
          <section class="group">
            <h2>/ GRAY</h2>
            <div class="preview relative clip">
              <canvas id="gray" class="absolute inset no-pointer"></canvas>
            </div>
          </section>
        </aside>
      </div>
    </div>
    <dialog id="recipe-panel" class="recipe-panel" aria-labelledby="recipe-panel-title">
      <div class="recipe-head">
        <div>
          <h2 id="recipe-panel-title">配方</h2>
          <p id="recipe-file-label"></p>
        </div>
        <button id="recipe-close" type="button">关闭</button>
      </div>
      <textarea id="recipe-json" spellcheck="false"></textarea>
      <div class="recipe-foot">
        <p id="recipe-note" role="status"></p>
        <button id="recipe-copy" type="button">复制</button>
        <button id="recipe-download" type="button">下载</button>
      </div>
    </dialog>
    <script type="module" src="./main.mjs?v=12"></script>
  </body>
</html>
