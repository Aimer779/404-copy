<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASCII GIF embed</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <style>
      html, body { height: 100%; margin: 0; background: #111; color: #ddd; font: 14px/1.4 sans-serif; }
      #ascii-slot {
        width: min(92vw, 720px);
        margin: 8vh auto 0;
        aspect-ratio: var(--aspect, 1);
        background: #f3f3f3;
      }
      p { text-align: center; color: #8d8d8d; }
    </style>
  </head>
  <body>
    <div id="ascii-slot"></div>
    <p id="status" role="status">Needs ?recipe=recipe.json</p>
    <script type="module">
      import { hasBakedFrames } from '../src/recipe.mjs'
      import { mountAsciiGif, mountAsciiRecipe } from '../src/mount.mjs'

      const status = document.querySelector('#status')
      const slot = document.querySelector('#ascii-slot')
      const params = new URLSearchParams(location.search)
      const url = params.get('recipe')
      const gif = params.get('gif')
      if (!url) {
        status.textContent = 'Open embed.html?recipe=./your-ascii.json&gif=../../../assets/squidward.gif'
      } else {
        try {
          const recipe = await fetch(url).then((response) => {
            if (!response.ok) throw new Error(`Fetch failed: ${response.status}`)
            return response.json()
          })
          slot.style.setProperty('--aspect', String(recipe.look.aspect || 1))
          if (hasBakedFrames(recipe)) mountAsciiRecipe(slot, recipe)
          else {
            const gifUrl = gif || recipe.source?.name
            if (!gifUrl) throw new Error('This recipe needs the original GIF. Add ?gif=')
            await mountAsciiGif(slot, gifUrl, recipe)
          }
          status.textContent = `${recipe.source?.name || url} · ${recipe.look.columns}×${recipe.look.rows}`
        } catch (error) {
          status.textContent = error.message
        }
      }
    </script>
  </body>
</html>
